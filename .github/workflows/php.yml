name: PHP

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHPCS (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer

      - name: Inštalácia závislostí
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP lint
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 php -l

      - name: WordPress Coding Standards
        run: vendor/bin/phpcs

      - name: PHPCompatibility (minimálna podporovaná verzia)
        if: matrix.php == '8.1'
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.1-

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: none
          tools: composer

      - name: Inštalácia závislostí
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit testy
        run: vendor/bin/phpunit

  js:
    name: JS testy (blocker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inštalácia závislostí
        run: npm install --no-save --no-audit --no-fund jsdom

      - name: Syntax check
        run: |
          node --check modules/Blocker/js/blocker.js
          node --check public/js/consent-banner.js

      - name: Testy blockera
        run: node tests/js/blocker.test.mjs

      - name: Testy bannera
        run: node tests/js/banner.test.mjs

  react:
    name: React build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: Kontrola, že build je commitnutý
        run: |
          if [ -n "$(git status --porcelain admin/ui/dist)" ]; then
            echo "::error::admin/ui/dist nie je commitnutý — spustite npm run build."
            git diff --stat admin/ui/dist
            exit 1
          fi

      - name: Kontrola index.asset.php
        run: |
          test -f admin/ui/dist/index.asset.php
          grep -q "wp-api-fetch" admin/ui/dist/index.asset.php
          grep -q "wp-components" admin/ui/dist/index.asset.php

  composer:
    name: composer validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Validácia composer.json
        run: composer validate --strict --no-check-lock